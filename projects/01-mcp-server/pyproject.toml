[project]
name = "fde-mcp"
version = "0.1.0"
description = "MCP server bridging GitHub, a local SQLite ops DB, and Telegram alerts — with role-based tool access and per-source degradation."
readme = "README.md"
authors = [{ name = "Armando Gomez" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
fde-mcp = "fde_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fde_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
