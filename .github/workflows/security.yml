name: Dependency security
on:
  push:
  pull_request:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Audit both locked environments, excluding only local source packages
        run: |
          for project in projects/01-mcp-server projects/02-eval-harness; do
            (cd "$project" && uv export --frozen --no-emit-project --no-emit-package fde-mcp --format requirements-txt --output-file /tmp/audit-requirements.txt --quiet)
            pip-audit -r /tmp/audit-requirements.txt --no-deps --disable-pip --progress-spinner off
          done
