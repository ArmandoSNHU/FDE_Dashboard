name: CI

# The dashboard claims "N tests passing". This workflow is what makes that claim true:
# it runs the suite on two operating systems, regenerates the dashboard's data from that
# run, and only then publishes the site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/01-mcp-server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --frozen

      - name: Run the test suite
        run: uv run pytest -q

      - name: Run the end-to-end demo
        run: uv run python scripts/demo.py

      # Regression guard: the demo once crashed on a console that couldn't encode its output.
      - name: Run the demo on a legacy code page
        if: runner.os == 'Windows'
        run: uv run python scripts/demo.py
        env:
          PYTHONIOENCODING: cp1252

      - name: Check role filtering over a real stdio session
        run: uv run python scripts/smoke_stdio.py

  deploy:
    name: publish dashboard
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the generator reports the commit count

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --frozen
        working-directory: projects/01-mcp-server

      - name: Generate dashboard data from a real test run
        run: uv run python scripts/build_dashboard_data.py
        working-directory: projects/01-mcp-server

      - name: Assemble the site
        run: |
          mkdir -p _site/assets
          cp index.html 404.html robots.txt sitemap.xml .nojekyll dashboard-data.json _site/
          cp assets/* _site/assets/
          echo "published files:" && ls -R _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
