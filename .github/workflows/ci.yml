name: CI

# The dashboard claims "N tests passing". This workflow is what makes that claim true:
# it tests every project on two operating systems through one reusable workflow,
# regenerates the dashboard's data from a real run, and only then publishes the site.
#
#   python-project.yml           reusable: one project, Ubuntu + Windows, tests + checks
#   actions/setup-uv-project     composite: install uv, sync from the lockfile
#
# tests/test_ci_contract.py (project 01) pins this shape: every project has a job here,
# uv is pinned in one place, the cp1252 guard stays wired, and deploy waits for everything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mcp-server:
    name: 01 mcp-server
    uses: ./.github/workflows/python-project.yml
    with:
      project-dir: projects/01-mcp-server
      checks: |
        uv run python scripts/demo.py
        uv run python scripts/smoke_stdio.py
      legacy-console-check: uv run python scripts/demo.py

  evals:
    name: 02 eval-harness
    uses: ./.github/workflows/python-project.yml
    with:
      project-dir: projects/02-eval-harness
      # Fails under 94% or on a single unsafe decision, so the published score stays true.
      checks: uv run fde-evals --check

  deploy:
    name: publish dashboard
    needs: [mcp-server, evals]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the generator reports the commit count

      - uses: ./.github/actions/setup-uv-project
        with:
          working-directory: projects/01-mcp-server

      - uses: ./.github/actions/setup-uv-project
        with:
          working-directory: projects/02-eval-harness

      - name: Re-score the evals so the published numbers are from this commit
        run: uv run fde-evals
        working-directory: projects/02-eval-harness

      - name: Generate dashboard data from a real test run
        run: uv run python scripts/build_dashboard_data.py
        working-directory: projects/01-mcp-server

      - name: Assemble the site
        run: |
          mkdir -p _site/assets
          cp index.html 404.html robots.txt sitemap.xml .nojekyll dashboard-data.json _site/
          cp assets/* _site/assets/
          echo "published files:" && ls -R _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
